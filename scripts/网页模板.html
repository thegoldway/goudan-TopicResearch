<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>〔报告标题〕</title>
<style>
:root{--navy:#002960;--b3:#00478E;--b4:#0056A5;--cyan:#00A9F4;--slate:#6B7A89;
--mute:#AFC1D6;--bg:#F5F6F7;--line:#DDE1E6;--pale:#E6EFF8;--ink:#1F2E3A;--dark:#15324F}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",system-ui,sans-serif;font-size:15px;line-height:1.9;
-webkit-font-smoothing:antialiased}
button{font-family:inherit}
h1,h3{margin:0;font-weight:600;letter-spacing:.01em}
[hidden]{display:none!important}
.mast{background:var(--navy);color:#fff;padding:30px 24px 28px}
.mast-in{max-width:900px;margin:0 auto}
.mast h1{font-size:30px;line-height:1.35;letter-spacing:.02em;margin:0}
.abs{max-width:900px;margin:28px auto 0;padding:0 24px}
.abs-in{border-left:3px solid var(--navy);background:var(--bg);padding:22px 26px}
.absk{display:block;font-size:10px;letter-spacing:.2em;color:var(--b4);margin-bottom:12px}
.abs-in p{margin:0 0 15px;font-size:14.6px;line-height:1.98;text-align:justify;color:var(--dark)}
.abs-in p:last-child{margin-bottom:0}
.outline{list-style:none;max-width:900px;margin:0 auto;padding:34px 24px 44px}
.br{position:relative;margin:0 0 20px}
.br:last-child{margin-bottom:0}
.bh{position:relative;display:flex;align-items:baseline;gap:11px;padding:0 0 11px 22px}
.bh::before{content:"";position:absolute;left:1px;top:6px;width:8px;height:8px;border:2px solid var(--b4);
border-radius:50%;background:#fff}
.bh .bno{font-size:10.5px;letter-spacing:.16em;color:var(--b4)}
.bh h3{font-size:13.5px;color:var(--navy);letter-spacing:.09em}
.lv2{list-style:none;margin:0;padding-left:26px;border-left:1px solid var(--mute);margin-left:8px}
.lv2>li{position:relative}
.lv2>li::before{content:"";position:absolute;left:-26px;top:31px;width:26px;height:1px;background:var(--line)}
.card{background:#fff;position:relative}
.lv2 .node{border-bottom:1px solid var(--line)}
.lv2 .node:last-child{border-bottom:0}
.node-head{display:grid;grid-template-columns:24px minmax(0,1fr) 14px;gap:16px;align-items:start;
padding:15px 0 15px 10px;width:100%;text-align:left;background:none;border:0;cursor:pointer;color:inherit}
.node-head:focus-visible{outline:2px solid var(--cyan);outline-offset:-2px}
.node-head .num{font-size:11px;letter-spacing:.1em;color:var(--b4);padding-top:3px}
.node-head h3{font-size:16.5px;line-height:1.55;color:var(--dark);margin:0 0 8px}
.node.open .node-head h3{font-size:17.5px;color:var(--navy);margin:0}
.evs{display:grid;gap:5px}
.evs .ev{position:relative;padding-left:14px;font-size:12.6px;line-height:1.72;color:#41525F}
.evs .ev::before{content:"";position:absolute;left:1px;top:8px;width:4px;height:4px;background:var(--mute)}
.evs .more{letter-spacing:0;padding-left:1px;color:var(--mute)}
.go{font-size:15px;color:var(--mute);text-align:right;padding-top:1px}
.go::before{content:"＋"}
.node.open .go{color:var(--navy)}
.node.open .go::before{content:"－"}
.node.open .node-head{padding-bottom:6px}
.node.open .evs{display:none}
.node-body{padding:2px 0 30px 40px}
.prose p{margin:0 0 15px;font-size:15.2px;line-height:1.98;text-align:justify;color:var(--ink)}
.prose p:last-child{margin-bottom:0}
.fig{margin:26px 0;border-top:2px solid var(--navy);padding-top:10px;max-width:740px}
.fig-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.fig-no{font-size:11px;letter-spacing:.14em;color:var(--b4);font-weight:600}
.fig-title{font-size:13.5px;font-weight:600;color:var(--navy);flex:1;line-height:1.5}
.fig-tools .tbtn{border:1px solid var(--line);background:#fff;color:var(--slate);font-size:11px;
padding:2px 8px;cursor:pointer}
.fig-tools .tbtn[aria-pressed="true"]{background:var(--pale);border-color:var(--mute);color:var(--navy)}
.fig-canvas svg{display:block;width:100%;height:auto}
.fig-table{margin:10px 0 4px;overflow-x:auto}
.fig-table table{border-collapse:collapse;width:100%;font-size:12.5px}
.fig-table th,.fig-table td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:right}
.fig-table th:first-child,.fig-table td:first-child{text-align:left}
.fig-table th{color:var(--slate);font-weight:600;background:var(--bg)}
figcaption{font-size:10.5px;color:var(--slate);line-height:1.7;margin-top:8px}
footer{border-top:1px solid var(--line);margin-top:50px;padding:26px 24px 60px;font-size:11.5px;
color:var(--slate)}
.foot-in{max-width:900px;margin:0 auto;line-height:1.9}
.foot-in b{color:var(--b3);font-weight:600}
@media(max-width:720px){
  .mast p,.mast h1{font-size:22px}
  .lv2{padding-left:16px;margin-left:4px}
  .lv2>li::before{left:-16px;width:16px}
  .node-head{grid-template-columns:20px minmax(0,1fr) 14px;gap:10px}
  .node-body{padding-left:30px}
  .abs-in{padding:18px 18px}
  .prose p{font-size:15px}
}
</style>
</head>

<script>
(function(){
  var heads=[].slice.call(document.querySelectorAll('[data-head]'));
  function toggle(card,open){
    var body=card.querySelector('.card-body'), head=card.querySelector('[data-head]');
    if(!body||!head)return;
    if(open){card.classList.add('open');body.hidden=false;head.setAttribute('aria-expanded','true');}
    else{card.classList.remove('open');body.hidden=true;head.setAttribute('aria-expanded','false');}
  }
  heads.forEach(function(h){
    h.addEventListener('click',function(){
      var card=h.closest('.card');
      toggle(card,!card.classList.contains('open'));
    });
  });
  [].forEach.call(document.querySelectorAll('.fig'),function(fig){
    var table=fig.querySelector('table'), btn=fig.querySelector('[data-act="table"]');
    if(btn&&table){btn.addEventListener('click',function(){
      var hidden=!table.parentNode.hidden; table.parentNode.hidden=hidden;
      btn.setAttribute('aria-pressed',hidden?'false':'true');
    });}
    if(btn)btn.setAttribute('aria-label','显示或隐藏该图的数据表');
  });
})();
</script>
